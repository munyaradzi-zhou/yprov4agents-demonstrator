# Continuous integration for the demonstrator.
#
# The gates are ordered cheapest-first so a style slip fails in seconds rather than after
# a full pipeline run. Two of them are unusual and deliberate:
#
#   * `conformance` judges emitted provenance with the reference `prov` parser, not with
#     project code. The claim that this system emits standard W3C PROV-JSON is only worth
#     something if an independent implementation agrees.
#   * `pipeline` runs the demonstrator end to end and diffs the result against a frozen
#     archive. A change that alters the provenance without saying so fails the build.
#
# No job calls a paid API. The LLM-backed path is exercised locally and archived under
# experiments/; CI runs the deterministic path, which is why `--strict` comparison is
# meaningful here.
#
# Extras are named rather than installed wholesale with --all-extras: the `energy` extra
# pulls a backend that samples hardware counters, and no job here is measuring energy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NATIVE_TLS: "1"   # see the note in pyproject.toml
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra eval --extra dev
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .

  types:
    name: Type check (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter in requires-python. Checking only one would let a construct
        # that is valid on 3.11 and broken on 3.12 (or the reverse) reach a release.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra eval --extra dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} mypy yprov4agenticai runtime eval tests

  test:
    name: Tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: the project asserts SHA-256 hashes over
        # files it writes, and text-mode line-ending translation makes those hashes
        # platform-dependent (todo.md D4). A Linux-only matrix would never catch it.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra eval --extra dev --python ${{ matrix.python }}
      - name: pytest
        run: uv run pytest -v --cov=yprov4agenticai --cov=runtime --cov-report=term-missing
      - name: Verify frozen archives still match their manifests
        shell: bash
        run: |
          for archive in experiments/*/; do
            name=$(basename "$archive")
            uv run python -m eval.archive verify --name "$name"
          done

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra eval --extra dev

      # --baseline attaches the Strategy A callback reconstruction to the same run, so
      # E3 is measured over identical work rather than over two separate runs.
      - name: Run the demonstrator (in-process bus, deterministic agents)
        run: uv run python run_local.py --out-dir out --persist-timeout 20 --baseline

      - name: Evaluate
        run: uv run python -m eval.evaluate --out-dir out --markdown out/RESULTS.md

      # The paper's central claim, as a gate: the rationale must not be recoverable from
      # anything the callback layer observed. A hit here means the claim needs narrowing.
      - name: Assert the rationale is unreachable from the callback stream
        run: uv run pytest -v tests/test_baseline.py

      # Compared against the current reference, not the pre-review baseline: Phase 1
      # changed the emitted provenance deliberately. The baseline archive is kept as the
      # historical evidence behind the review measurements, and `eval.compare` against it
      # is how a phase reports what it changed — but the gate has to track the present.
      #
      # Phase 2 moved all six agents onto the capture API and changed nothing
      # structural, which is the claim this gate enforces: the ergonomic layer emits the
      # same graph as the primitives it wraps. Phase 3's archive is structurally identical
      # to Phase 2's — attaching the callback baseline observes the run without altering
      # it. Phase 4 differs from Phase 3 by exactly two declared attributes, yp:summary_mode
      # and yp:report_mode, now recorded on the step that produced the text rather than only
      # on the decision about it. Phase 5 changed no provenance at all: the two defects
      # the overhead study found were performance defects, and the records they produce are
      # byte-identical before and after — which the gate is what establishes. Phase 6
      # adds exactly one declared attribute: MC1 cites the standard it checked against.
      - name: Assert the provenance did not change unannounced
        run: |
          uv run python -m eval.compare \
            --before experiments/verdict-reachability \
            --after out \
            --strict

      - name: Run the conformance suite against freshly emitted provenance
        run: uv run pytest -v -m conformance --prov-dir out

      # The vocabulary's SHACL shapes, applied by an independent engine. This is what
      # makes "every decision is justified" a conformance statement against a declared
      # standard rather than a self-report by the agent that enforces it.
      - name: Validate the emitted records against vocab/shapes.ttl
        run: uv run python -m eval.validate_shapes --prov-dir out

      # Every verdict the README advertises must still be reachable. Each fault goes into
      # the input or the environment, never into the check being tested, so this measures
      # the agents rather than the harness.
      - name: Provoke every alternative verdict
        run: uv run python -m eval.fault_injection --all --out-dir out/faults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-provenance
          path: out/
          retention-days: 14

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: yprov4agents-demonstrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image must run the agents it claims to contain
        run: |
          for role in ca1 cax ca2 ca3 mc1 mc3; do
            docker run --rm --entrypoint python yprov4agents-demonstrator:ci -c "
          from runtime.agent_runner import REGISTRY
          module, cls = REGISTRY['$role']
          mod = __import__(f'runtime.agents.{module}', fromlist=[cls])
          assert getattr(mod, cls), '$role missing'
          print('$role ok')"
          done

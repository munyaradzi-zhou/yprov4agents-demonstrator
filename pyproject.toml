[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yprov4agents-demonstrator"
version = "0.2.0"
description = "Reflexive W3C PROV instrumentation for multi-agent systems: agents that record why they decided what they decided."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "MC Zhou", email = "munyaradzizhou11@gmail.com" }]
keywords = ["provenance", "w3c-prov", "agentic-ai", "mlops", "reproducibility"]

# Runtime dependencies. Upper bounds are deliberate: this repository is a paper artifact,
# so a future major release must not silently change the numbers a reviewer reproduces.
# Exact versions are pinned in uv.lock; these are the compatible ranges.
dependencies = [
    "matplotlib>=3.8,<4",     # CA2 chart rendering (headless Agg backend)
    "nats-py>=2.6,<3",        # provenance bus client; containerised path only
    "openai>=1.40,<2",        # CAx summaries and CA3 narration
    # Verifies TLS against the OS certificate store. Required wherever a proxy terminates
    # TLS with a locally-trusted root: without it the API client cannot connect and the
    # LLM-bearing agents silently degrade to deterministic output, which would be reported
    # as model output. A silent downgrade is worse than a failure in a measured run.
    "truststore>=0.9,<0.12",
]

[project.optional-dependencies]
# Evaluation and benchmarking. Separate from runtime so the container image stays minimal.
eval = [
    "prov>=2.0,<3",           # independent W3C PROV-JSON parser: conformance gate
    "pandas>=2.2,<3",         # structured results handling
    "psutil>=5.9,<7",         # peak RSS for the E6 pipeline level
    "rdflib>=7.0,<8",         # yp: vocabulary (Turtle)
    "pyshacl>=0.26,<0.31",    # SHACL validation of emitted provenance
]
# Energy accounting. A separate extra because the backend samples hardware counters and
# writes its own output, which no run that is measuring *time* should be paying for — see
# runtime/util.py::energy_tracker. Install it for a run whose subject is energy.
energy = [
    "codecarbon>=2.5,<4",
]
# A real agent framework, for the baseline that observes the agents the way a deployment
# would: LangGraph nodes, observed through LangChain's own callback handler. Only the
# framework-baseline experiment needs it, so nothing else pays for its dependency tree.
frameworks = [
    "langgraph>=0.6,<2",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<0.15",
    "mypy>=1.11,<2",
    "types-psutil>=6.0,<8",   # psutil ships no inline types
]

[project.urls]
Homepage = "https://github.com/munyaradzi-zhou/yprov4agents-demonstrator"

[tool.hatch.build.targets.wheel]
# Three distributable packages: the instrumentation core, the agent runtime, the harness.
packages = ["yprov4agenticai", "runtime", "eval", "paper"]

[tool.uv]
# Use the operating system certificate store rather than the bundled roots. Required on
# networks that terminate TLS at a proxy with a locally-trusted root CA, which would
# otherwise fail package resolution with `invalid peer certificate: UnknownIssuer`.
#
# Newer uv releases deprecate this key in favour of `system-certs` and warn about it.
# The old name is kept because uv 0.7.2 -- the version this project is developed
# against -- does not recognise the new one, and silencing a cosmetic warning is not
# worth an environment that cannot resolve its own dependencies.
native-tls = true

# ──────────────────────────────────────────────────────────────────────────────────
# Lint and format
# ──────────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 96
target-version = "py311"
extend-exclude = ["experiments"]   # frozen artifacts are evidence, not source

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ANN",       # annotations
    "PTH",       # prefer pathlib
    "RET",       # return consistency
    "ARG",       # unused arguments
    "DTZ",       # timezone-aware datetimes  <- load-bearing: see CA3 timestamp handling
]
ignore = [
    "ANN401",    # Any is legitimate for PROV-JSON documents, which are untyped by nature
    "B008",      # argparse/Path defaults in function signatures
    # Prose in this codebase is scientific writing: en dashes, σ, ★ and arrows carry
    # meaning in docstrings that quote the paper. Flagging them as homoglyph risks is a
    # false positive here, and "fixing" them would corrupt the terminology.
    "RUF001",    # ambiguous unicode in strings
    "RUF002",    # ambiguous unicode in docstrings
    "RUF003",    # ambiguous unicode in comments
    # Agents implement two fixed contracts — StreamingAgent.process(session, doc,
    # source_subject) and the bus handler (subject, envelope) — and an implementation that
    # needs only some of those arguments must still accept all of them. Renaming the
    # unused ones would obscure which contract is being satisfied.
    "ARG002",    # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG"]         # test signatures carry fixtures, not annotations
# The prompt registry is a content store: each prompt's text is hashed and versioned, so
# rewrapping a line changes its SHA and silently invalidates the prompt's identity.
"yprov4agenticai/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["yprov4agenticai", "runtime", "eval"]

# ──────────────────────────────────────────────────────────────────────────────────
# Types
# ──────────────────────────────────────────────────────────────────────────────────
[tool.mypy]
# python_version is deliberately NOT pinned here. Pinning it to 3.11 while the environment
# runs 3.12 makes mypy parse third-party stubs built for the newer interpreter under older
# syntax rules, which fails on constructs like PEP 695 `type` statements in numpy's stubs.
# mypy follows the interpreter instead, and CI checks every version in requires-python.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
# Third-party packages without bundled type information.
module = ["nats.*", "prov.*", "matplotlib.*", "codecarbon.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Installed only with the `frameworks` extra, which the type-check job does not install.
module = ["langgraph.*", "langchain_core.*"]
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────────────────────────
# Tests
# ──────────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "conformance: asserts emitted provenance is valid, resolvable W3C PROV",
    "known_defect: encodes a defect recorded in todo.md; expected to fail until its fix lands",
    "slow: takes more than a few seconds (full pipeline, benchmarks)",
    "llm: performs a real API call; requires OPENAI_API_KEY and incurs cost",
]

# The whole demonstrator, on a laptop, in one file.
#
#   cp .env.example .env         # at the repository ROOT; loaded via env_file below
#                                # set LLM_REQUIRED=1 to forbid silent stub fallback
#   docker compose -f deploy/docker-compose.yml up --build
#
# Flow:
#   producer --(producer.yprov4ml.*)--> [cax, ca2, ca3] --(agent.lifecycle.*)--> [mc1, mc3]
#                                   \__ ca1 holds the record, persists AFTER consumers ack
#
# Broker: NATS. Outputs (emitted PROV-JSON, charts, store) land in ./out on your host, or in
# the directory named by OUT_HOST_DIR (relative to this file) — CI uses that to keep a
# distributed run's records apart from an in-process run's.

x-runtime: &runtime
  build:
    context: ..                      # folder root — image needs yprov4agenticai/ + runtime/
    dockerfile: deploy/Dockerfile
  image: yprov4agents-demonstrator:0.2.0
  depends_on: [broker]
  volumes:
    - ${OUT_HOST_DIR:-../out}:/out   # emitted PROV-JSON + charts + store, on your host
  # Compose resolves a bare `.env` against THIS file's directory, so the repository-root
  # .env is invisible to `-f deploy/docker-compose.yml`. Name it explicitly.
  env_file:
    - path: ../.env
      required: false
  restart: on-failure

services:
  # ── the broker: the "post office" every message passes through ──────────────
  broker:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927  # pinned; see deploy/Dockerfile
    command: ["-m", "8222"]          # HTTP monitoring on :8222
    # Published on loopback only. The broker has no authentication, so on every other
    # interface it would accept publishes from anyone on the network — including forged
    # lifecycle records for the meta agents to govern. The agents reach it over the
    # compose network, which this does not affect.
    ports:
      - "127.0.0.1:4222:4222"        # client port
      - "127.0.0.1:8222:8222"        # monitoring

  # ── operational agents ──────────────────────────────────────────────────────
  ca1:                               # CA1 — persist, AFTER consumers have used the record
    <<: *runtime
    environment:
      NATS_URL: nats://broker:4222
      ROLE: ca1
      PERSIST_AFTER: cax,ca2,ca3     # whose acknowledgement gates persistence
      PERSIST_TIMEOUT_S: "25"        # safety net if a consumer dies

  cax:                               # CAx — NL provenance summariser (LLM optional)
    <<: *runtime
    environment:
      NATS_URL: nats://broker:4222
      ROLE: cax

  ca2:                               # CA2 — metrics visualiser (deterministic)
    <<: *runtime
    environment:
      NATS_URL: nats://broker:4222
      ROLE: ca2

  ca3:                               # CA3 — analytics (heuristic core, LLM narration)
    <<: *runtime
    environment:
      NATS_URL: nats://broker:4222
      ROLE: ca3

  # ── meta agents (govern the operational agents' own PROV) ───────────────────
  mc1:                               # MC1 — compliance (justification/standard checks)
    <<: *runtime
    environment:
      NATS_URL: nats://broker:4222
      ROLE: mc1

  mc3:                               # MC3 — auditability (who-did-what trail)
    <<: *runtime
    environment:
      NATS_URL: nats://broker:4222
      ROLE: mc3

  # ── the producer: replays REAL yProv4ML records onto the bus ────────────────
  producer:
    <<: *runtime
    depends_on: [broker, ca1, cax, ca2, ca3, mc1, mc3]
    environment:
      NATS_URL: nats://broker:4222
      ROLE: producer
      DATA_DIR: /data
      EXPECTED_AGENTS: ca1,cax,ca2,ca3,mc1,mc3
      STREAM_DELAY_MS: "150"
    volumes:
      - ${OUT_HOST_DIR:-../out}:/out
      - ../data/yprov4ml:/data:ro    # the real example_0 / example_2 records
